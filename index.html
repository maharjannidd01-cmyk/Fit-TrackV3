<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitTrack Pro">
<meta name="description" content="Offline-first workout, nutrition and fitness tracking PWA.">
<title>FitTrack Pro</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="session-bar" role="status" aria-live="polite">
    <div class="sb-blk"><div class="sb-lbl">Time</div><div class="sb-val" id="sb-time" style="color:var(--accent)">00:00</div></div>
    <div class="sb-mid"><div class="sb-prog-bar"><div class="sb-prog-fill" id="sb-prog" style="width:0%"></div></div><div class="sb-prog-lbl" id="sb-prog-lbl">0/0 sets</div></div>
    <div class="sb-blk"><div class="sb-lbl">Burned</div><div class="sb-val" id="sb-burn" style="color:var(--red)">0</div></div>
    <button class="sb-nav-btn" onclick="go('workout')">→ Workout</button>
  </div>

  <div id="rest-bar" role="status" aria-live="assertive">
    <div class="rb-ring" onclick="openRestOverlay()">
      <svg viewBox="0 0 60 60" aria-hidden="true">
        <circle cx="30" cy="30" r="24" fill="none" stroke="var(--faint)" stroke-width="5"/>
        <circle id="rb-ring" cx="30" cy="30" r="24" fill="none" stroke="var(--accent)" stroke-width="5" stroke-dasharray="150.8" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90 30 30)"/>
      </svg>
      <div class="rb-center"><span class="rb-count" id="rb-count">01:30</span><span class="rb-label">REST</span></div>
    </div>
    <div class="rb-info" onclick="openRestOverlay()"><div class="rb-title" id="rb-title">Rest Timer</div><div class="rb-sub">Tap to expand</div></div>
    <div class="rb-btns" onclick="event.stopPropagation()"><div class="rb-row"><button class="rb-btn" onclick="startRest(60)">60s</button><button class="rb-btn" onclick="startRest(90)">90s</button><button class="rb-btn" onclick="startRest(120)">2m</button></div><button class="rb-skip" onclick="skipRest()">Skip Rest →</button></div>
  </div>

  <header id="app-header">
    <div class="brand-lockup"><div class="brand-mark">FT</div><div><div class="brand-name">FIT<span>TRACK</span></div><div class="brand-tag">TRAIN • TRACK • TRANSFORM</div></div></div>
    <div class="header-actions"><div class="header-status"><span class="status-dot"></span><span>Today</span></div><button id="settings-btn" class="header-icon" type="button" aria-label="Open settings" title="Settings">⚙</button></div>
  </header>
  <main id="scroll" aria-live="polite"></main>

  <nav id="nav" aria-label="Primary navigation">
    <button class="nb on" data-p="home" onclick="go('home')"><i aria-hidden="true">⌂</i><span>Home</span></button>
    <button class="nb" data-p="workout" onclick="go('workout')"><i aria-hidden="true">◈</i><span>Train</span></button>
    <button class="nb nav-primary" data-p="food" onclick="go('food')"><i aria-hidden="true">+</i><span>Log</span></button>
    <button class="nb" data-p="dashboard" onclick="go('dashboard')"><i aria-hidden="true">◒</i><span>Stats</span></button>
    <button class="nb" data-p="plans" onclick="go('plans')"><i aria-hidden="true">☷</i><span>Plans</span></button>
  </nav>
</div>

<div id="rest-overlay" onclick="closeRestOverlay()" role="dialog" aria-modal="true" aria-label="Rest timer">
  <div class="rov-ring"><svg viewBox="0 0 320 320" aria-hidden="true"><circle cx="160" cy="160" r="132" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="14"/><circle id="rov-ring" cx="160" cy="160" r="132" fill="none" stroke="var(--accent)" stroke-width="14" stroke-dasharray="829.4" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90 160 160)"/></svg><div class="rov-center"><div class="rov-count" id="rov-count">01:30</div><div class="rov-label">REST · tap outside to close</div></div></div>
  <div class="rov-btns" onclick="event.stopPropagation()"><button class="rov-btn" onclick="startRest(60);closeRestOverlay()">60s</button><button class="rov-btn" onclick="startRest(90);closeRestOverlay()">90s</button><button class="rov-btn" onclick="startRest(120);closeRestOverlay()">2 min</button><button class="rov-btn" onclick="startRest(180);closeRestOverlay()">3 min</button></div>
  <button class="rov-skip" onclick="skipRest();closeRestOverlay()">Skip Rest →</button>
</div>
<div id="summary-overlay"><div class="sum-inner" id="sum-inner"></div></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js" defer></script>
</body>
</html>
